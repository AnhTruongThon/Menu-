<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Món Anh Trưởng Thôn</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        h1, h2 { color: #d35400; text-align: center; }
        .menu-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .price { font-weight: bold; color: #c0392b; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2ecc71; }
        #cart { margin-top: 30px; padding: 20px; background-color: #f9f9f9; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Thực Đơn Của Quán</h1>
    
    <div class="menu-item">
        <div>
            <h3>Cơm Tấm Sườn Bì Chả</h3>
            <p class="price">45,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Cơm Tấm Sườn Bì Chả', 45000)">Thêm vào giỏ</button>
    </div>

    <div class="menu-item">
        <div>
            <h3>Phở Bò Tái Nạm</h3>
            <p class="price">50,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Phở Bò Tái Nạm', 50000)">Thêm vào giỏ</button>
    </div>

    <div id="cart">
        <h2>Giỏ Hàng Của Bạn</h2>
        <ul id="cart-items"></ul>
        <p><strong>Tổng cộng: <span id="total-price">0</span> VNĐ</strong></p>
        <button onclick="checkout()">Đặt Hàng Ngay</button>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(itemName, itemPrice) {
            cart.push({ name: itemName, price: itemPrice });
            total += itemPrice;
            updateCartUI();
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name + ' - ' + item.price.toLocaleString() + ' VNĐ';
                cartItems.appendChild(li);
            });
            document.getElementById('total-price').textContent = total.toLocaleString();
        }

       function checkout() {
            if (cart.length === 0) {
                alert("Giỏ hàng đang trống! Bạn hãy chọn món trước nhé.");
                return;
            }

            // 1. Tạo nội dung tin nhắn đơn hàng
            let orderText = "Chào quán, tôi muốn đặt các món sau:\n\n";
            cart.forEach(item => {
                orderText += "▪️ " + item.name + "\n";
            });
            orderText += "\nTổng thanh toán: " + total.toLocaleString() + " VNĐ\n";
            orderText += "Vui lòng giao đến địa chỉ: ...";

            // 2. Tự động sao chép (copy) nội dung đơn hàng
            navigator.clipboard.writeText(orderText).then(() => {
                alert("ĐÃ SAO CHÉP ĐƠN HÀNG!\n\nSau khi bấm OK, ứng dụng Zalo sẽ mở ra. Bạn chỉ cần bấm 'DÁN' (Paste) vào khung chat để gửi đơn cho quán nhé.");
                
                // 3. Chuyển hướng sang Zalo (THAY SỐ ZALO CỦA BẠN VÀO ĐÂY)
                let zaloNumber = "0342358549"; // Nhập số điện thoại Zalo của quán
                window.location.href = "https://zalo.me/" + zaloNumber;
                
            }).catch(err => {
                // Đề phòng thiết bị của khách chặn tính năng copy tự động
                alert("Hệ thống chưa thể copy tự động. Bạn vui lòng chụp ảnh màn hình giỏ hàng này và gửi qua Zalo số 0342358549 nhé!");
                window.location.href = "https://zalo.me/";
            });
        }
    </script>
</body>
</html>
