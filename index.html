<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Món Quán Ăn</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        h1, h2 { color: #d35400; text-align: center; }
        .menu-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .price { font-weight: bold; color: #c0392b; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2ecc71; }
        #cart { margin-top: 30px; padding: 20px; background-color: #f9f9f9; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Thực Đơn Của Quán</h1>
    
    <div class="menu-item">
        <div>
            <h3>Cơm Tấm Sườn Bì Chả</h3>
            <p class="price">45,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Cơm Tấm Sườn Bì Chả', 45000)">Thêm vào giỏ</button>
    </div>

    <div class="menu-item">
        <div>
            <h3>Phở Bò Tái Nạm</h3>
            <p class="price">50,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Phở Bò Tái Nạm', 50000)">Thêm vào giỏ</button>
    </div>

    <div id="cart">
        <h2>Giỏ Hàng Của Bạn</h2>
        <ul id="cart-items"></ul>
        <p><strong>Tổng cộng: <span id="total-price">0</span> VNĐ</strong></p>
        <button onclick="checkout()">Đặt Hàng Ngay</button>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(itemName, itemPrice) {
            cart.push({ name: itemName, price: itemPrice });
            total += itemPrice;
            updateCartUI();
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name + ' - ' + item.price.toLocaleString() + ' VNĐ';
                cartItems.appendChild(li);
            });
            document.getElementById('total-price').textContent = total.toLocaleString();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Giỏ hàng đang trống!");
                return;
            }
            alert("Cảm ơn bạn đã đặt hàng! Tổng thanh toán là: " + total.toLocaleString() + " VNĐ. Tính năng gửi đơn hàng tới chủ quán cần kết nối máy chủ để hoạt động.");
        }
    </script>
</body>
</html>
