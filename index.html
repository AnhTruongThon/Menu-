<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Món Quán Ăn</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        h1, h2 { color: #d35400; text-align: center; }
        .menu-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .price { font-weight: bold; color: #c0392b; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2ecc71; }
        #cart { margin-top: 30px; padding: 20px; background-color: #f9f9f9; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Thực Đơn Của Quán</h1>
    
    <!-- Món ăn 1 -->
    <div class="menu-item">
        <div>
            <h3>Cơm Tấm Sườn Bì Chả</h3>
            <p class="price">45,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Cơm Tấm Sườn Bì Chả', 45000)">Thêm vào giỏ</button>
    </div>

    <!-- Món ăn 2 -->
    <div class="menu-item">
        <div>
            <h3>Phở Bò Tái Nạm</h3>
            <p class="price">50,000 VNĐ</p>
        </div>
        <button onclick="addToCart('Phở Bò Tái Nạm', 50000)">Thêm vào giỏ</button>
    </div>

    <div id="cart">
        <h2>Giỏ Hàng Của Bạn</h2>
        <ul id="cart-items"></ul>
        <p><strong>Tổng cộng: <span id="total-price">0</span> VNĐ</strong></p>
        <button onclick="checkout()">Đặt Hàng Ngay</button>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(itemName, itemPrice) {
            cart.push({ name: itemName, price: itemPrice });
            total += itemPrice;
            updateCartUI();
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name + ' - ' + item.price.toLocaleString() + ' VNĐ';
                cartItems.appendChild(li);
            });
            document.getElementById('total-price').textContent = total.toLocaleString();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Giỏ hàng đang trống! Bạn hãy chọn món trước nhé.");
                return;
            }

            let customerName = prompt("Vui lòng nhập TÊN của bạn:");
            if (!customerName) return; 

            let customerPhone = prompt("Vui lòng nhập SỐ ĐIỆN THOẠI và ĐỊA CHỈ giao hàng:");
            if (!customerPhone) return;

            let orderText = "🚨 CÓ ĐƠN HÀNG MỚI!\n\n";
            orderText += "👤 Khách hàng: " + customerName + "\n";
            orderText += "📞 Thông tin: " + customerPhone + "\n\n";
            orderText += "📋 DANH SÁCH MÓN:\n";
            
            cart.forEach(item => {
                orderText += "▪️ " + item.name + "\n";
            });
            
            orderText += "\n💰 Tổng tiền: " + total.toLocaleString() + " VNĐ";

            // BẠN CHỈ CẦN THAY 2 DÒNG DƯỚI ĐÂY:
            const TOKEN = "8690982170:AAHaKB3dKj9IW0I0MXqHDF88vvK-aQ7FK8o";
            const CHAT_ID = "7403980630";
            
            const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: orderText
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("✅ Đặt hàng thành công! Quán sẽ sớm liên hệ để giao món cho bạn.");
                    cart = [];
                    total = 0;
                    updateCartUI();
                } else {
                    alert("❌ Có lỗi xảy ra, không thể gửi đơn hàng. Vui lòng kiểm tra lại Token và Chat ID.");
                }
            })
            .catch(error => {
                alert("❌ Lỗi mạng. Vui lòng kiểm tra lại kết nối internet!");
            });
        }
    </script>
</body>
</html>
